
 
    <header class="encabezado">
        <mat-icon>school</mat-icon>
      <h1>Mi agenda universitaria</h1>
      <p>Organiza tus materias en un solo lugar</p>
    </header>

<!-- Agrupa el campo con el texto que lo identifica. -->
<div class="formulario-tareas">


         <label for="titulo">Tarea</label>
         <input id="titulo"
         [(ngModel)]="nuevaTarea"
         type="text"
         placeholder="Escribe una nueva tarea">


        <label for="materia">Materia</label>
            <input id="materia"
            [(ngModel)]="nuevaMateria"
            type="text"
            placeholder="Escribe una nueva materia"
        >
     

         <label for="fecha-entrega">Fecha</label>
         <input id="fecha-entrega"
         [(ngModel)]="nuevaFechaEntrega"
         type="date"
         >

    <!-- Al hacer clic, ejecuta el método agregarTarea del componente. -->
    <button (click)="agregarTarea()"><mat-icon>add</mat-icon>Agregar</button>
</div>

<!-- Recorre las tareas. track permite a Angular identificar cada una por su ID. -->
@for (item of tareas; track item.identificador) {
    
    <div class="tarjeta-tarea">
         <!-- Muestra el título de la tarea mediante interpolación. -->
         <p class="titulo-tarea" [class.completada]="item.completada">{{item.titulo}}</p>


         <p class="materia-tarea">{{item.materia}}</p>

         <p class="fecha-tarea">Entrega {{item.fechaEntrega}}</p>

         <!-- Consulta el estado de la tarea para mostrar el texto correspondiente. -->
       
         @if (item.completada) {
        <p class="estado-completado">Completada</p>
         } @else {
         <p class="estado-pendiente">No completada</p>
        }
  
         <!-- Al hacer clic, invierte y guarda el estado de esta tarea. -->
         
         <div class="acciones-tarea">
         <button class="boton-estado"(click)="cambiarEstado(item)">

            <!-- El texto indica la acción que realizará el botón. -->
             @if (item.completada) {
                <mat-icon>undo</mat-icon>
            marcar como pendiente
            } @else {
                <mat-icon>check_circles</mat-icon>
            completar tarea
            }
        </button>
 
        <!-- al hacer clic , elimina una tarea por su identificador -->
        <button class="boton-eliminar" (click)="eliminarTarea(item.identificador) "><mat-icon>delete</mat-icon>Eliminar</button>
        </div>
    </div>

}  @empty {<p class="lista-vacia">no hay tareas</p>}
